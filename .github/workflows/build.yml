name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "AGENTS.md"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sciafpad
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf automake libtool pkg-config \
            libgtk-4-dev \
            valac gobject-introspection blueprint-compiler \
            git xz-utils gettext autopoint \
            debhelper devscripts

      - name: Build scintilla-gtk4-bugaevc .deb
        run: |
          git clone --depth=1 https://github.com/bugaevc/scintilla.git "$HOME/scintilla-src"
          cp -r packaging/ScintillaWidget/debian "$HOME/scintilla-src/"
          cp packaging/ScintillaWidget/scintilla-gtk4-bugaevc.pc.in "$HOME/scintilla-src/debian/"
          cd "$HOME/scintilla-src"
          dpkg-buildpackage -b -us -uc -d

      - name: Install scintilla-gtk4-bugaevc .deb
        run: |
          sudo dpkg -i "$HOME"/scintilla-gtk4-bugaevc_*.deb || sudo apt-get -f install -y
          sudo ldconfig
          pkg-config --modversion scintilla-gtk4-bugaevc

      - name: Configure sciafpad
        run: |
          ./autogen.sh
          mkdir -p build/autotools
          cd build/autotools
          ../../configure

      - name: Build sciafpad
        run: |
          cd build/autotools
          make -j"$(nproc)"

      - name: Run distcheck
        run: |
          cd build/autotools
          make distcheck

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: sciafpad-tarball
          path: build/autotools/sciafpad-*.tar.xz